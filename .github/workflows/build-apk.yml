          cat > ticoo-android/app/src/main/java/org/ticoo/app/ReminderWorker.java <<'TICOO_EOF'
          package org.ticoo.app;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Build;

          import androidx.work.Worker;
          import androidx.work.WorkerParameters;

          import org.json.JSONObject;

          import java.io.BufferedReader;
          import java.io.InputStreamReader;
          import java.net.HttpURLConnection;
          import java.net.URL;

          // Every 12 hours: asks the site what to say ("Time to vote", off while no vote link is set),
          // then shows a notification that opens the vote page (top.gg / botlist.me).
          public class ReminderWorker extends Worker {

              public ReminderWorker(Context context, WorkerParameters params) {
                  super(context, params);
              }

              @Override
              public Result doWork() {
                  Context c = getApplicationContext();
                  if (!c.getSharedPreferences("ticoo", Context.MODE_PRIVATE).getBoolean("n_vote", true)) {
                      return Result.success();   // turned off in Settings
                  }

                  String title = "Time to vote for Ticoo";
                  String text = "You can vote again on top.gg and botlist.me. It takes 10 seconds.";
                  String url = "/vote";

                  try {
                      HttpURLConnection con = (HttpURLConnection)
                              new URL(MainActivity.BASE + "/app/reminder.json").openConnection();
                      con.setConnectTimeout(8000);
                      con.setReadTimeout(8000);
                      con.setRequestProperty("User-Agent", "TicooApp/1.0");
                      if (con.getResponseCode() == 200) {
                          StringBuilder sb = new StringBuilder();
                          BufferedReader br = new BufferedReader(
                                  new InputStreamReader(con.getInputStream(), "UTF-8"));
                          String line;
                          while ((line = br.readLine()) != null) {
                              sb.append(line);
                          }
                          br.close();
                          JSONObject o = new JSONObject(sb.toString());
                          if (!o.optBoolean("enabled", true)) {
                              con.disconnect();
                              return Result.success();   // no vote link set: stay quiet
                          }
                          title = o.optString("title", title);
                          text = o.optString("text", text);
                          url = o.optString("url", url);
                      }
                      con.disconnect();
                  } catch (Exception ignored) {
                      // offline or server down: use the default text
                  }

                  notifyNow(c, title, text, url);
                  return Result.success();
              }

              static void notifyNow(Context c, String title, String text, String url) {
                  show(c, title, text, url, "ticoo_vote", "Vote reminders", 1);
              }

              static void show(Context c, String title, String text, String url,
                               String channelId, String channelName, int id) {
                  NotificationManager nm =
                          (NotificationManager) c.getSystemService(Context.NOTIFICATION_SERVICE);
                  if (Build.VERSION.SDK_INT >= 26) {
                      nm.createNotificationChannel(new NotificationChannel(
                              channelId, channelName, NotificationManager.IMPORTANCE_DEFAULT));
                  }

                  Intent open = new Intent(c, MainActivity.class);
                  open.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                  open.putExtra("url", url);
                  PendingIntent pi = PendingIntent.getActivity(
                          c, id, open, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);

                  Notification.Builder b = Build.VERSION.SDK_INT >= 26
                          ? new Notification.Builder(c, channelId)
                          : new Notification.Builder(c);
                  b.setSmallIcon(R.drawable.ic_notif)
                          .setContentTitle(title)
                          .setContentText(text)
                          .setStyle(new Notification.BigTextStyle().bigText(text))
                          .setContentIntent(pi)
                          .setAutoCancel(true);
                  try {
                      nm.notify(id, b.build());
                  } catch (SecurityException ignored) {
                      // notification permission not granted
                  }
              }
          }
