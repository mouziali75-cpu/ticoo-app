          package org.ticoo.app;

          import android.content.Context;
          import android.content.SharedPreferences;

          import androidx.work.Worker;
          import androidx.work.WorkerParameters;

          import org.json.JSONObject;

          import java.io.BufferedReader;
          import java.io.InputStreamReader;
          import java.net.HttpURLConnection;
          import java.net.URL;

          // About once an hour: asks the site for the latest update id. A new id = "Ticoo was updated" notification.
          // The first check only remembers the id (no notification right after installing).
          public class UpdateWorker extends Worker {

              public UpdateWorker(Context context, WorkerParameters params) {
                  super(context, params);
              }

              @Override
              public Result doWork() {
                  Context c = getApplicationContext();
                  SharedPreferences p = c.getSharedPreferences("ticoo", Context.MODE_PRIVATE);
                  try {
                      HttpURLConnection con = (HttpURLConnection)
                              new URL(MainActivity.BASE + "/app/update.json").openConnection();
                      con.setConnectTimeout(8000);
                      con.setReadTimeout(8000);
                      con.setRequestProperty("User-Agent", "TicooApp/1.0");
                      if (con.getResponseCode() != 200) {
                          con.disconnect();
                          return Result.success();
                      }
                      StringBuilder sb = new StringBuilder();
                      BufferedReader br = new BufferedReader(
                              new InputStreamReader(con.getInputStream(), "UTF-8"));
                      String line;
                      while ((line = br.readLine()) != null) {
                          sb.append(line);
                      }
                      br.close();
                      con.disconnect();

                      JSONObject o = new JSONObject(sb.toString());
                      String id = o.optString("id", "");
                      if (id.isEmpty()) return Result.success();

                      String last = p.getString("last_update_id", null);
                      p.edit().putString("last_update_id", id).apply();
                      if (last == null || last.equals(id)) return Result.success();
                      if (!p.getBoolean("n_upd", true)) return Result.success();

                      ReminderWorker.show(c,
                              o.optString("title", "Ticoo was updated"),
                              o.optString("text", "Tap to see what's new."),
                              o.optString("url", "/changelog"),
                              "ticoo_update", "Update alerts", 2);
                  } catch (Exception ignored) {
                      // offline: try again next time
                  }
                  return Result.success();
              }
          }
          TICOO_EOF

      - name: Download app icon
        run: |
          set -e
          curl -fsSL -A "Mozilla/5.0" -o ticoo-android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png https://ticoo.wispbyte.org/app/icon-512.png
          head -c 4 ticoo-android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png | grep -aq PNG || { echo "Icon download failed"; exit 1; }

      - name: Build APK
        working-directory: ticoo-android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp ticoo-android/app/build/outputs/apk/debug/app-debug.apk Ticoo.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Ticoo-APK
          path: Ticoo.apk

      - name: Publish release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Ticoo APK build ${{ github.run_number }}
          files: Ticoo.apk
