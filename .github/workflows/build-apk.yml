name: Build Ticoo APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Android project
        run: |
          set -e
          mkdir -p ticoo-android ticoo-android/app ticoo-android/app/src/main ticoo-android/app/src/main/java/org/ticoo/app ticoo-android/app/src/main/res/drawable ticoo-android/app/src/main/res/mipmap-xxxhdpi
          cat > ticoo-android/settings.gradle <<'TICOO_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "TicooApp"
          include ':app'
          TICOO_EOF
          cat > ticoo-android/build.gradle <<'TICOO_EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          TICOO_EOF
          cat > ticoo-android/gradle.properties <<'TICOO_EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          TICOO_EOF
          cat > ticoo-android/app/build.gradle <<'TICOO_EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'org.ticoo.app'
              compileSdk 34

              defaultConfig {
                  applicationId 'org.ticoo.app'
                  minSdk 24
                  targetSdk 34
                  versionCode 2
                  versionName '1.2'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.work:work-runtime:2.9.1'
          }
          TICOO_EOF
          cat > ticoo-android/app/src/main/AndroidManifest.xml <<'TICOO_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="Ticoo"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="https" android:host="ticoo.wispbyte.org" android:path="/app/" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          TICOO_EOF
          cat > ticoo-android/app/src/main/java/org/ticoo/app/MainActivity.java <<'TICOO_EOF'
          package org.ticoo.app;

          import android.Manifest;
          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.ActivityNotFoundException;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.content.res.ColorStateList;
          import android.graphics.Bitmap;
          import android.graphics.Color;
          import android.graphics.PorterDuff;
          import android.graphics.drawable.ColorDrawable;
          import android.graphics.drawable.Drawable;
          import android.graphics.drawable.GradientDrawable;
          import android.graphics.drawable.StateListDrawable;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.text.Editable;
          import android.text.Spannable;
          import android.text.SpannableStringBuilder;
          import android.text.TextUtils;
          import android.text.TextWatcher;
          import android.text.style.ForegroundColorSpan;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.inputmethod.EditorInfo;
          import android.view.inputmethod.InputMethodManager;
          import android.webkit.CookieManager;
          import android.os.Message;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebStorage;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.CheckBox;
          import android.widget.EditText;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.PopupWindow;
          import android.widget.ProgressBar;
          import android.widget.TextView;
          import android.widget.Toast;

          import androidx.work.Constraints;
          import androidx.work.NetworkType;
          import androidx.work.ExistingPeriodicWorkPolicy;
          import androidx.work.PeriodicWorkRequest;
          import androidx.work.WorkManager;

          import java.util.concurrent.TimeUnit;

          public class MainActivity extends Activity {

              // ===== Settings you can change =====
              static final String BASE = "https://ticoo.wispbyte.org";
              static final String START_URL = BASE + "/app/";

              // Pages from these sites open inside the app (subdomains included).
              static final String[] ALLOWED_HOSTS = {
                      "ticoo.wispbyte.org",
                      "discord.com",
                      "discordapp.com",
                      "top.gg",
                      "botlist.me"
              };

              // These always open in the matching phone app / browser.
              static final String[] EXTERNAL_HOSTS = {
                      "discord.gg", "t.me", "telegram.me", "wa.me", "play.google.com", "mediafire.com"
              };
              static final String APP_VERSION = "1.2";

              // Vote reminder interval in hours
              static final long REMINDER_HOURS = 12;
              // ====================================

              static final String DESKTOP_UA =
                      "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) "
                              + "Chrome/124.0.0.0 Safari/537.36 TicooApp/1.0";
              static final int FILE_REQ = 2;

              static final int BG = Color.parseColor("#0F1117");
              static final int BAR = Color.parseColor("#161922");
              static final int PILL = Color.parseColor("#262A38");
              static final int MUTED = Color.parseColor("#9AA0B4");
              static final int ACCENT = Color.parseColor("#5865F2");
              static final int PRESSED = Color.parseColor("#2B3040");

              private WebView web;
              private ProgressBar progress;
              private TextView urlText;
              private ImageView lockIcon;
              private ImageView reloadBtn;
              private LinearLayout findBar;
              private EditText findInput;
              private PopupWindow menuPopup;
              private String mobileUa;
              private boolean desktop;
              private boolean loading;
              private SharedPreferences prefs;
              private ValueCallback<Uri[]> fileCallback;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  prefs = getSharedPreferences("ticoo", MODE_PRIVATE);
                  desktop = prefs.getBoolean("desktop", false);

                  getWindow().setStatusBarColor(BAR);
                  getWindow().setNavigationBarColor(BG);

                  web = new WebView(this);
                  web.setBackgroundColor(BG);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(BG);

                  root.addView(buildTopBar(), new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, dp(56)));

                  progress = new ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal);
                  progress.setMax(100);
                  progress.setProgressTintList(ColorStateList.valueOf(ACCENT));
                  progress.setVisibility(View.INVISIBLE);
                  root.addView(progress, new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, dp(2)));

                  root.addView(buildFindBar(), new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, dp(48)));

                  root.addView(web, new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, 0, 1f));
                  setContentView(root);

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setJavaScriptCanOpenWindowsAutomatically(true);
                  s.setSupportZoom(true);
                  s.setBuiltInZoomControls(true);
                  s.setDisplayZoomControls(false);
                  s.setLoadWithOverviewMode(true);
                  s.setUseWideViewPort(true);
                  s.setSupportMultipleWindows(true);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_COMPATIBILITY_MODE);
                  s.setMediaPlaybackRequiresUserGesture(true);
                  s.setTextZoom(prefs.getInt("zoom", 100));
                  mobileUa = s.getUserAgentString().replace("; wv", "").replace("Version/4.0 ", "")
                          + " TicooApp/1.0";
                  applyMode();

                  CookieManager cm = CookieManager.getInstance();
                  cm.setAcceptCookie(true);
                  cm.setAcceptThirdPartyCookies(web, true);

                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onProgressChanged(WebView view, int newProgress) {
                          progress.setProgress(newProgress);
                          progress.setVisibility(newProgress >= 100 ? View.INVISIBLE : View.VISIBLE);
                      }

                      @Override
                      public boolean onCreateWindow(WebView view, boolean isDialog, boolean isUserGesture,
                                                    Message resultMsg) {
                          // Popups only after a real tap (like Chrome's popup blocker). The page opens in this same view.
                          if (!isUserGesture) return false;
                          WebView temp = new WebView(MainActivity.this);
                          temp.setWebViewClient(new WebViewClient() {
                              @Override
                              public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest request) {
                                  handleUrl(request.getUrl(), true);
                                  v.destroy();
                                  return true;
                              }

                              @Override
                              public void onPageStarted(WebView v, String url, Bitmap favicon) {
                                  if (url != null && url.startsWith("http")) {
                                      handleUrl(Uri.parse(url), true);
                                      v.stopLoading();
                                      v.destroy();
                                  }
                              }
                          });
                          WebView.WebViewTransport t = (WebView.WebViewTransport) resultMsg.obj;
                          t.setWebView(temp);
                          resultMsg.sendToTarget();
                          return true;
                      }

                      @Override
                      public boolean onShowFileChooser(WebView webView, ValueCallback<Uri[]> callback,
                                                       FileChooserParams params) {
                          if (fileCallback != null) {
                              fileCallback.onReceiveValue(null);
                          }
                          fileCallback = callback;
                          try {
                              startActivityForResult(params.createIntent(), FILE_REQ);
                          } catch (ActivityNotFoundException e) {
                              fileCallback = null;
                              return false;
                          }
                          return true;
                      }
                  });

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          return handleUrl(request.getUrl(), false);
                      }

                      @Override
                      public void onPageStarted(WebView view, String url, Bitmap favicon) {
                          loading = true;
                          reloadBtn.setImageResource(R.drawable.ic_close);
                          updateUrlBar(url);
                      }

                      @Override
                      public void doUpdateVisitedHistory(WebView view, String url, boolean isReload) {
                          updateUrlBar(url);
                      }

                      @Override
                      public void onPageFinished(WebView view, String url) {
                          loading = false;
                          reloadBtn.setImageResource(R.drawable.ic_refresh);
                          updateUrlBar(url);
                          CookieManager.getInstance().flush();
                          if (desktop) {
                              view.evaluateJavascript(
                                      "(function(){var m=document.querySelector('meta[name=viewport]');"
                                              + "if(!m){m=document.createElement('meta');m.name='viewport';"
                                              + "document.head.appendChild(m);}"
                                              + "m.setAttribute('content','width=1100');})();", null);
                          }
                      }

                      @Override
                      public void onReceivedError(WebView view, WebResourceRequest request,
                                                  WebResourceError error) {
                          if (request.isForMainFrame()) {
                              String html = "<html><body style='background:#0f1117;color:#f2f3f5;"
                                      + "font-family:sans-serif;text-align:center;padding-top:30vh'>"
                                      + "<h2>No connection</h2>"
                                      + "<p><a style='color:#5865F2;font-size:20px' href='" + START_URL
                                      + "'>Retry</a></p></body></html>";
                              view.loadDataWithBaseURL(null, html, "text/html", "utf-8", null);
                          }
                      }
                  });

                  web.setDownloadListener((url, userAgent, contentDisposition, mimetype, contentLength) ->
                          openExternal(Uri.parse(url)));

                  if (savedInstanceState != null) {
                      web.restoreState(savedInstanceState);
                  } else {
                      web.loadUrl(targetFromIntent(getIntent()));
                  }

                  setupReminders();
              }

              // ---------- Top bar (Chrome style) ----------

              private LinearLayout buildTopBar() {
                  LinearLayout top = new LinearLayout(this);
                  top.setOrientation(LinearLayout.HORIZONTAL);
                  top.setGravity(Gravity.CENTER_VERTICAL);
                  top.setBackgroundColor(BAR);
                  top.setPadding(dp(6), dp(6), dp(2), dp(6));

                  top.addView(iconButton(R.drawable.ic_home, v -> web.loadUrl(START_URL)),
                          new LinearLayout.LayoutParams(dp(44), dp(44)));

                  LinearLayout pill = new LinearLayout(this);
                  pill.setOrientation(LinearLayout.HORIZONTAL);
                  pill.setGravity(Gravity.CENTER_VERTICAL);
                  GradientDrawable pbg = new GradientDrawable();
                  pbg.setColor(PILL);
                  pbg.setCornerRadius(dp(22));
                  pill.setBackground(pbg);
                  pill.setPadding(dp(14), 0, dp(2), 0);

                  lockIcon = new ImageView(this);
                  lockIcon.setImageResource(R.drawable.ic_lock);
                  lockIcon.setColorFilter(MUTED, PorterDuff.Mode.SRC_IN);
                  pill.addView(lockIcon, new LinearLayout.LayoutParams(dp(14), dp(14)));

                  urlText = new TextView(this);
                  urlText.setSingleLine(true);
                  urlText.setEllipsize(TextUtils.TruncateAt.END);
                  urlText.setTextSize(14f);
                  urlText.setTextColor(Color.WHITE);
                  urlText.setGravity(Gravity.CENTER_VERTICAL);
                  urlText.setPadding(dp(8), 0, dp(4), 0);
                  urlText.setText("Ticoo");
                  pill.addView(urlText, new LinearLayout.LayoutParams(
                          0, LinearLayout.LayoutParams.MATCH_PARENT, 1f));

                  reloadBtn = iconButton(R.drawable.ic_refresh, v -> {
                      if (loading) {
                          web.stopLoading();
                      } else {
                          web.reload();
                      }
                  });
                  pill.addView(reloadBtn, new LinearLayout.LayoutParams(dp(40), dp(40)));

                  LinearLayout.LayoutParams pillLp = new LinearLayout.LayoutParams(0, dp(44), 1f);
                  pillLp.setMargins(dp(6), 0, dp(2), 0);
                  top.addView(pill, pillLp);

                  top.addView(iconButton(R.drawable.ic_more, v -> showMenu(v)),
                          new LinearLayout.LayoutParams(dp(44), dp(44)));
                  return top;
              }

              private LinearLayout buildFindBar() {
                  findBar = new LinearLayout(this);
                  findBar.setOrientation(LinearLayout.HORIZONTAL);
                  findBar.setGravity(Gravity.CENTER_VERTICAL);
                  findBar.setBackgroundColor(BAR);
                  findBar.setPadding(dp(14), 0, dp(4), 0);
                  findBar.setVisibility(View.GONE);

                  findInput = new EditText(this);
                  findInput.setHint("Find in page");
                  findInput.setHintTextColor(MUTED);
                  findInput.setTextColor(Color.WHITE);
                  findInput.setTextSize(15f);
                  findInput.setSingleLine(true);
                  findInput.setBackgroundColor(Color.TRANSPARENT);
                  findInput.setImeOptions(EditorInfo.IME_ACTION_SEARCH);
                  findInput.addTextChangedListener(new TextWatcher() {
                      @Override
                      public void beforeTextChanged(CharSequence s, int start, int count, int after) {
                      }

                      @Override
                      public void onTextChanged(CharSequence s, int start, int before, int count) {
                      }

                      @Override
                      public void afterTextChanged(Editable s) {
                          String q = s.toString();
                          if (q.isEmpty()) {
                              web.clearMatches();
                          } else {
                              web.findAllAsync(q);
                          }
                      }
                  });
                  findInput.setOnEditorActionListener((v, actionId, event) -> {
                      web.findNext(true);
                      return true;
                  });
                  findBar.addView(findInput, new LinearLayout.LayoutParams(
                          0, LinearLayout.LayoutParams.MATCH_PARENT, 1f));

                  findBar.addView(iconButton(R.drawable.ic_up, v -> web.findNext(false)),
                          new LinearLayout.LayoutParams(dp(44), dp(44)));
                  findBar.addView(iconButton(R.drawable.ic_down, v -> web.findNext(true)),
                          new LinearLayout.LayoutParams(dp(44), dp(44)));
                  findBar.addView(iconButton(R.drawable.ic_close, v -> closeFind()),
                          new LinearLayout.LayoutParams(dp(44), dp(44)));
                  return findBar;
              }

              private void openFind() {
                  findBar.setVisibility(View.VISIBLE);
                  findInput.requestFocus();
                  InputMethodManager imm = (InputMethodManager) getSystemService(Context.INPUT_METHOD_SERVICE);
                  if (imm != null) {
                      imm.showSoftInput(findInput, InputMethodManager.SHOW_IMPLICIT);
                  }
              }

              private void closeFind() {
                  web.clearMatches();
                  findInput.setText("");
                  findBar.setVisibility(View.GONE);
                  InputMethodManager imm = (InputMethodManager) getSystemService(Context.INPUT_METHOD_SERVICE);
                  if (imm != null) {
                      imm.hideSoftInputFromWindow(findInput.getWindowToken(), 0);
                  }
                  web.requestFocus();
              }

              private void updateUrlBar(String url) {
                  if (url == null || !url.startsWith("http")) {
                      urlText.setText("Ticoo");
                      lockIcon.setVisibility(View.GONE);
                      return;
                  }
                  Uri u = Uri.parse(url);
                  String host = u.getHost() == null ? url : u.getHost();
                  String rest = u.getEncodedPath() == null ? "" : u.getEncodedPath();
                  if (u.getEncodedQuery() != null) {
                      rest = rest + "?" + u.getEncodedQuery();
                  }
                  if ("/".equals(rest)) {
                      rest = "";
                  }
                  SpannableStringBuilder sb = new SpannableStringBuilder(host);
                  int hl = host.length();
                  sb.append(rest);
                  if (rest.length() > 0) {
                      sb.setSpan(new ForegroundColorSpan(MUTED), hl, sb.length(),
                              Spannable.SPAN_EXCLUSIVE_EXCLUSIVE);
                  }
                  urlText.setText(sb);
                  lockIcon.setVisibility("https".equals(u.getScheme()) ? View.VISIBLE : View.GONE);
              }

              // ---------- Chrome-like menu ----------

              private void showMenu(View anchor) {
                  if (menuPopup != null && menuPopup.isShowing()) {
                      menuPopup.dismiss();
                      return;
                  }
                  LinearLayout menu = new LinearLayout(this);
                  menu.setOrientation(LinearLayout.VERTICAL);
                  GradientDrawable bgd = new GradientDrawable();
                  bgd.setColor(Color.parseColor("#1B1D27"));
                  bgd.setCornerRadius(dp(18));
                  bgd.setStroke(dp(1), Color.parseColor("#2A2E3D"));
                  menu.setBackground(bgd);
                  menu.setPadding(dp(6), dp(6), dp(6), dp(6));

                  // top row: back / forward / reload / share
                  LinearLayout row = new LinearLayout(this);
                  row.setOrientation(LinearLayout.HORIZONTAL);
                  row.addView(menuIcon(R.drawable.ic_back, web.canGoBack(), v -> {
                      closeMenu();
                      web.goBack();
                  }), rowParams());
                  row.addView(menuIcon(R.drawable.ic_forward, web.canGoForward(), v -> {
                      closeMenu();
                      web.goForward();
                  }), rowParams());
                  row.addView(menuIcon(R.drawable.ic_refresh, true, v -> {
                      closeMenu();
                      web.reload();
                  }), rowParams());
                  row.addView(menuIcon(R.drawable.ic_share, true, v -> {
                      closeMenu();
                      shareLink();
                  }), rowParams());
                  menu.addView(row, new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, dp(48)));
                  menu.addView(divider());

                  menu.addView(menuItem(R.drawable.ic_desktop, "Desktop site", Boolean.valueOf(desktop), v -> {
                      closeMenu();
                      toggleDesktop();
                  }));
                  menu.addView(menuItem(R.drawable.ic_search, "Find in page", null, v -> {
                      closeMenu();
                      openFind();
                  }));
                  menu.addView(menuItem(R.drawable.ic_copy, "Copy link", null, v -> {
                      closeMenu();
                      copyLink();
                  }));
                  menu.addView(menuItem(R.drawable.ic_open, "Open in browser", null, v -> {
                      closeMenu();
                      String url = web.getUrl();
                      if (url != null && url.startsWith("http")) {
                          openExternal(Uri.parse(url));
                      }
                  }));
                  menu.addView(menuItem(R.drawable.ic_trade, "Trade Hub", null, v -> {
                      closeMenu();
                      web.loadUrl(BASE + "/app/trade");
                  }));
                  menu.addView(menuItem(R.drawable.ic_settings, "Settings", null, v -> {
                      closeMenu();
                      web.loadUrl(settingsUrl());
                  }));
                  menu.addView(divider());
                  menu.addView(menuItem(R.drawable.ic_logout, "Clear data and log out", null, v -> {
                      closeMenu();
                      clearData();
                  }));

                  PopupWindow pw = new PopupWindow(menu, dp(264), ViewGroup.LayoutParams.WRAP_CONTENT, true);
                  pw.setElevation(dp(10));
                  pw.setBackgroundDrawable(new ColorDrawable(Color.TRANSPARENT));
                  pw.setOutsideTouchable(true);
                  menuPopup = pw;
                  pw.showAsDropDown(anchor, 0, dp(2), Gravity.END);
              }

              private void closeMenu() {
                  if (menuPopup != null) {
                      menuPopup.dismiss();
                  }
              }

              private LinearLayout.LayoutParams rowParams() {
                  return new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.MATCH_PARENT, 1f);
              }

              private View divider() {
                  View d = new View(this);
                  d.setBackgroundColor(Color.parseColor("#2A2E3D"));
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, dp(1));
                  lp.setMargins(dp(8), dp(4), dp(8), dp(4));
                  d.setLayoutParams(lp);
                  return d;
              }

              private ImageView menuIcon(int res, boolean enabled, View.OnClickListener l) {
                  ImageView iv = new ImageView(this);
                  iv.setImageResource(res);
                  iv.setScaleType(ImageView.ScaleType.CENTER);
                  iv.setColorFilter(Color.WHITE, PorterDuff.Mode.SRC_IN);
                  iv.setBackground(pressBg(dp(12)));
                  if (enabled) {
                      iv.setOnClickListener(l);
                  } else {
                      iv.setAlpha(0.35f);
                  }
                  return iv;
              }

              private View menuItem(int iconRes, String label, Boolean checked, View.OnClickListener l) {
                  LinearLayout r = new LinearLayout(this);
                  r.setOrientation(LinearLayout.HORIZONTAL);
                  r.setGravity(Gravity.CENTER_VERTICAL);
                  r.setPadding(dp(14), 0, dp(10), 0);
                  r.setBackground(pressBg(dp(12)));
                  r.setOnClickListener(l);

                  ImageView iv = new ImageView(this);
                  iv.setImageResource(iconRes);
                  iv.setColorFilter(Color.parseColor("#C8CCD8"), PorterDuff.Mode.SRC_IN);
                  r.addView(iv, new LinearLayout.LayoutParams(dp(22), dp(22)));

                  TextView tv = new TextView(this);
                  tv.setText(label);
                  tv.setTextColor(Color.WHITE);
                  tv.setTextSize(15.5f);
                  tv.setPadding(dp(16), 0, 0, 0);
                  r.addView(tv, new LinearLayout.LayoutParams(
                          0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f));

                  if (checked != null) {
                      CheckBox cb = new CheckBox(this);
                      cb.setChecked(checked.booleanValue());
                      cb.setClickable(false);
                      cb.setFocusable(false);
                      cb.setButtonTintList(new ColorStateList(
                              new int[][]{new int[]{android.R.attr.state_checked}, new int[]{}},
                              new int[]{ACCENT, MUTED}));
                      r.addView(cb, new LinearLayout.LayoutParams(
                              LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT));
                  }
                  r.setLayoutParams(new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, dp(50)));
                  return r;
              }

              private ImageView iconButton(int res, View.OnClickListener l) {
                  ImageView iv = new ImageView(this);
                  iv.setImageResource(res);
                  iv.setScaleType(ImageView.ScaleType.CENTER);
                  iv.setColorFilter(Color.WHITE, PorterDuff.Mode.SRC_IN);
                  iv.setBackground(pressBg(dp(22)));
                  iv.setOnClickListener(l);
                  return iv;
              }

              private Drawable pressBg(float radiusPx) {
                  GradientDrawable pressed = new GradientDrawable();
                  pressed.setColor(PRESSED);
                  pressed.setCornerRadius(radiusPx);
                  StateListDrawable sl = new StateListDrawable();
                  sl.addState(new int[]{android.R.attr.state_pressed}, pressed);
                  sl.addState(new int[]{}, new ColorDrawable(Color.TRANSPARENT));
                  return sl;
              }

              private int dp(int v) {
                  return (int) (v * getResources().getDisplayMetrics().density + 0.5f);
              }

              // ---------- Actions ----------

              private void applyMode() {
                  web.getSettings().setUserAgentString(desktop ? DESKTOP_UA : mobileUa);
              }

              private void toggleDesktop() {
                  desktop = !desktop;
                  prefs.edit().putBoolean("desktop", desktop).apply();
                  applyMode();
                  String u = web.getUrl();
                  if (u != null && u.startsWith("http")) {
                      web.loadUrl(u);
                  } else {
                      web.reload();
                  }
                  Toast.makeText(this, desktop ? "Desktop site on" : "Desktop site off",
                          Toast.LENGTH_SHORT).show();
              }

              private void copyLink() {
                  String url = web.getUrl();
                  if (url == null) return;
                  ClipboardManager cb = (ClipboardManager) getSystemService(Context.CLIPBOARD_SERVICE);
                  cb.setPrimaryClip(ClipData.newPlainText("link", url));
                  Toast.makeText(this, "Link copied", Toast.LENGTH_SHORT).show();
              }

              private void shareLink() {
                  String url = web.getUrl();
                  if (url == null) return;
                  Intent send = new Intent(Intent.ACTION_SEND);
                  send.setType("text/plain");
                  send.putExtra(Intent.EXTRA_TEXT, url);
                  startActivity(Intent.createChooser(send, "Share link"));
              }

              private void clearData() {
                  new AlertDialog.Builder(this)
                          .setTitle("Log out?")
                          .setMessage("This clears cookies and saved site data. You will have to log in again.")
                          .setNegativeButton("Cancel", null)
                          .setPositiveButton("Log out", (d, w) -> {
                              CookieManager.getInstance().removeAllCookies(null);
                              CookieManager.getInstance().flush();
                              WebStorage.getInstance().deleteAllData();
                              web.clearCache(true);
                              web.loadUrl(START_URL);
                              Toast.makeText(this, "Logged out", Toast.LENGTH_SHORT).show();
                          })
                          .show();
              }

              // ---------- Helpers ----------

              // Returns true when the app took care of the link. loadHere = load it in the main view.
              private boolean handleUrl(Uri u, boolean loadHere) {
                  String scheme = u.getScheme() == null ? "" : u.getScheme();
                  String host = u.getHost() == null ? "" : u.getHost();
                  if ("ticoo".equals(scheme)) {
                      if (isTicooPage()) handleTicooAction(u);
                      return true;
                  }
                  if ("http".equals(scheme) || "https".equals(scheme)) {
                      // the Settings page address without state: open it with the current state
                      if (host.equals("ticoo.wispbyte.org") && "/app/settings".equals(u.getPath())
                              && u.getQueryParameter("zoom") == null) {
                          web.loadUrl(settingsUrl());
                          return true;
                      }
                      if (isExternalHost(host, u)) {
                          openExternal(u);
                          return true;
                      }
                      if (isAllowed(host) || prefs.getBoolean("inapp", true)) {
                          if (loadHere) web.loadUrl(u.toString());
                          return loadHere;
                      }
                      openExternal(u);
                      return true;
                  }
                  if ("intent".equals(scheme)) {
                      try {
                          Intent in = Intent.parseUri(u.toString(), Intent.URI_INTENT_SCHEME);
                          in.addCategory(Intent.CATEGORY_BROWSABLE);
                          in.setComponent(null);
                          in.setSelector(null);
                          startActivity(in);
                      } catch (Exception e) {
                          // app not installed: try the fallback link
                          try {
                              Intent in = Intent.parseUri(u.toString(), Intent.URI_INTENT_SCHEME);
                              String fb = in.getStringExtra("browser_fallback_url");
                              if (fb != null && fb.startsWith("http")) web.loadUrl(fb);
                          } catch (Exception ignored) {
                          }
                      }
                      return true;
                  }
                  openExternal(u);
                  return true;
              }

              private boolean isExternalHost(String host, Uri u) {
                  for (String h : EXTERNAL_HOSTS) {
                      if (host.equals(h) || host.endsWith("." + h)) return true;
                  }
                  return false;
              }

              private boolean isTicooPage() {
                  String cur = web.getUrl();
                  if (cur == null) return false;
                  Uri c = Uri.parse(cur);
                  return "https".equals(c.getScheme()) && "ticoo.wispbyte.org".equals(c.getHost());
              }

              private String settingsUrl() {
                  return BASE + "/app/settings?ver=" + APP_VERSION
                          + "&vote=" + (prefs.getBoolean("n_vote", true) ? 1 : 0)
                          + "&upd=" + (prefs.getBoolean("n_upd", true) ? 1 : 0)
                          + "&desk=" + (desktop ? 1 : 0)
                          + "&inapp=" + (prefs.getBoolean("inapp", true) ? 1 : 0)
                          + "&zoom=" + prefs.getInt("zoom", 100);
              }

              private void handleTicooAction(Uri u) {
                  String host = u.getHost() == null ? "" : u.getHost();
                  String arg = u.getPath() == null ? "" : u.getPath().replace("/", "");
                  if (host.equals("toggle")) {
                      if (arg.equals("vote")) {
                          prefs.edit().putBoolean("n_vote", !prefs.getBoolean("n_vote", true)).apply();
                      } else if (arg.equals("upd")) {
                          prefs.edit().putBoolean("n_upd", !prefs.getBoolean("n_upd", true)).apply();
                      } else if (arg.equals("inapp")) {
                          prefs.edit().putBoolean("inapp", !prefs.getBoolean("inapp", true)).apply();
                      } else if (arg.equals("desk")) {
                          desktop = !desktop;
                          prefs.edit().putBoolean("desktop", desktop).apply();
                          applyMode();
                      }
                      web.loadUrl(settingsUrl());
                  } else if (host.equals("zoom")) {
                      int z = prefs.getInt("zoom", 100);
                      if (arg.equals("up")) z = Math.min(150, z + 10);
                      if (arg.equals("down")) z = Math.max(70, z - 10);
                      prefs.edit().putInt("zoom", z).apply();
                      web.getSettings().setTextZoom(z);
                      web.loadUrl(settingsUrl());
                  } else if (host.equals("do")) {
                      if (arg.equals("test")) {
                          ReminderWorker.notifyNow(this, "Ticoo", "Notifications work. You will get vote reminders and update alerts.", "/app/settings");
                      } else if (arg.equals("cache")) {
                          web.clearCache(true);
                          Toast.makeText(this, "Cache cleared", Toast.LENGTH_SHORT).show();
                      } else if (arg.equals("logout")) {
                          clearData();
                      } else if (arg.equals("share")) {
                          Intent send = new Intent(Intent.ACTION_SEND);
                          send.setType("text/plain");
                          send.putExtra(Intent.EXTRA_TEXT, "Ticoo app: " + BASE + "/app/download");
                          startActivity(Intent.createChooser(send, "Share"));
                      }
                  }
              }

              private boolean isAllowed(String host) {
                  if (host == null) return false;
                  for (String h : ALLOWED_HOSTS) {
                      if (host.equals(h) || host.endsWith("." + h)) return true;
                  }
                  return false;
              }

              private void openExternal(Uri uri) {
                  try {
                      startActivity(new Intent(Intent.ACTION_VIEW, uri));
                  } catch (ActivityNotFoundException ignored) {
                  }
              }

              // A reminder notification carries the page to open (for example /vote).
              private String targetFromIntent(Intent in) {
                  if (in == null) return START_URL;
                  String u = in.getStringExtra("url");
                  if ((u == null || u.isEmpty()) && in.getData() != null) u = in.getDataString();
                  if (u == null || u.isEmpty()) return START_URL;
                  if (u.startsWith("/")) return BASE + u;
                  Uri p = Uri.parse(u);
                  if ("https".equals(p.getScheme()) && isAllowed(p.getHost())) return u;
                  return START_URL;
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  setIntent(intent);
                  String u = intent.getStringExtra("url");
                  if ((u != null && !u.isEmpty()) || intent.getData() != null) {
                      web.loadUrl(targetFromIntent(intent));
                  }
              }

              private void setupReminders() {
                  if (Build.VERSION.SDK_INT >= 33
                          && checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS)
                          != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS}, 1);
                  }
                  PeriodicWorkRequest req = new PeriodicWorkRequest.Builder(
                          ReminderWorker.class, REMINDER_HOURS, TimeUnit.HOURS)
                          .setInitialDelay(REMINDER_HOURS, TimeUnit.HOURS)
                          .build();
                  WorkManager.getInstance(this).enqueueUniquePeriodicWork(
                          "ticoo_reminder", ExistingPeriodicWorkPolicy.KEEP, req);

                  // "Ticoo was updated" check, about once an hour
                  PeriodicWorkRequest upd = new PeriodicWorkRequest.Builder(
                          UpdateWorker.class, 1, TimeUnit.HOURS)
                          .setConstraints(new Constraints.Builder()
                                  .setRequiredNetworkType(NetworkType.CONNECTED).build())
                          .build();
                  WorkManager.getInstance(this).enqueueUniquePeriodicWork(
                          "ticoo_update", ExistingPeriodicWorkPolicy.KEEP, upd);
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  if (requestCode == FILE_REQ) {
                      if (fileCallback != null) {
                          fileCallback.onReceiveValue(
                                  WebChromeClient.FileChooserParams.parseResult(resultCode, data));
                          fileCallback = null;
                      }
                      return;
                  }
                  super.onActivityResult(requestCode, resultCode, data);
              }

              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  super.onSaveInstanceState(outState);
                  web.saveState(outState);
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  CookieManager.getInstance().flush();
              }

              @Override
              public void onBackPressed() {
                  if (menuPopup != null && menuPopup.isShowing()) {
                      menuPopup.dismiss();
                  } else if (findBar.getVisibility() == View.VISIBLE) {
                      closeFind();
                  } else if (web.canGoBack()) {
                      web.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
